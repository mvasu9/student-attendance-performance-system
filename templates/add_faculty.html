<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Faculty</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="dashboard">

    <h1>Add Faculty</h1>

    <div class="form-container">

        <form method="POST" action="/add_faculty">

            <label>Faculty ID</label>
            <input
                type="text"
                name="faculty_id"
                placeholder="Enter faculty ID"
                required
            >

            <label>Faculty Name</label>
            <input
                type="text"
                name="name"
                placeholder="Enter faculty name"
                required
            >

            <label>Email</label>
            <input
                type="email"
                name="email"
                placeholder="Enter email address"
                required
            >

            <label>Phone</label>
            <input
                type="text"
                name="phone"
                placeholder="Enter phone number"
            >

            <label>Department</label>
            <input
                type="text"
                name="department"
                placeholder="Example: CSE"
                required
            >

            <label>Designation</label>
            <input
                type="text"
                name="designation"
                placeholder="Example: Professor"
            >

            <button type="submit">
                Add Faculty
            </button>

        </form>

    </div>

    <div class="page-actions">

        <a href="/faculty">
            <button type="button">
                Back to Faculty
            </button>
        </a>

        <a href="/admin_dashboard">
            <button type="button">
                Back to Dashboard
            </button>
        </a>

    </div>

</div>

</body>

</html>
