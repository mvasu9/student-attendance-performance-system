<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Subject</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="dashboard">

    <h1>Edit Subject</h1>

    <div class="form-container">

        <form method="POST">

            <label>Subject Code</label>
            <input
                type="text"
                name="subject_code"
                value="{{ subject[1] }}"
                required
            >

            <label>Subject Name</label>
            <input
                type="text"
                name="subject_name"
                value="{{ subject[2] }}"
                required
            >

            <label>Department</label>
            <input
                type="text"
                name="department"
                value="{{ subject[3] }}"
                required
            >

            <label>Year</label>

            <select name="year" required>

                <option value="1" {% if subject[4] == 1 %}selected{% endif %}>
                    1st Year
                </option>

                <option value="2" {% if subject[4] == 2 %}selected{% endif %}>
                    2nd Year
                </option>

                <option value="3" {% if subject[4] == 3 %}selected{% endif %}>
                    3rd Year
                </option>

                <option value="4" {% if subject[4] == 4 %}selected{% endif %}>
                    4th Year
                </option>

            </select>

            <label>Semester</label>

            <select name="semester" required>

                <option value="1-1" {% if subject[5] == "1-1" %}selected{% endif %}>
                    1-1
                </option>

                <option value="1-2" {% if subject[5] == "1-2" %}selected{% endif %}>
                    1-2
                </option>

                <option value="2-1" {% if subject[5] == "2-1" %}selected{% endif %}>
                    2-1
                </option>

                <option value="2-2" {% if subject[5] == "2-2" %}selected{% endif %}>
                    2-2
                </option>

                <option value="3-1" {% if subject[5] == "3-1" %}selected{% endif %}>
                    3-1
                </option>

                <option value="3-2" {% if subject[5] == "3-2" %}selected{% endif %}>
                    3-2
                </option>

                <option value="4-1" {% if subject[5] == "4-1" %}selected{% endif %}>
                    4-1
                </option>

                <option value="4-2" {% if subject[5] == "4-2" %}selected{% endif %}>
                    4-2
                </option>

            </select>

            <label>Faculty</label>

            <select name="faculty_id" required>

                {% for member in faculty %}

                <option
                    value="{{ member[0] }}"
                    {% if subject[6] == member[0] %}selected{% endif %}
                >
                    {{ member[1] }} - {{ member[2] }}
                </option>

                {% endfor %}

            </select>

            <button type="submit">
                Update Subject
            </button>

        </form>

    </div>

    <div class="page-actions">

        <a href="/subjects">
            <button type="button">
                Back to Subjects
            </button>
        </a>

        <a href="/admin_dashboard">
            <button type="button">
                Back to Dashboard
            </button>
        </a>

    </div>

</div>

</body>

</html>
